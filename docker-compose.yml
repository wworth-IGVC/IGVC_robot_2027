services:
  igvc_dev_zed:
    image: ghcr.io/gold-rush-robotics/dev-zed:5.1.0-13.0.0
    container_name: igvc_dev_zed
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    runtime: nvidia
    gpus: all
    volumes:
      - .:/root/ros2_ws/src/IGVC_robot_2026
      - /tmp:/tmp
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - FASTDDS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
      - FASTRTPS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
      - uid=1000
      - gid=1000
    command: >-
      /bin/bash -lc "
      cp -f /root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/common_stereo_real.yaml
      /root/ros2_ws/src/zed-ros2-wrapper/zed_wrapper/config/common_stereo.yaml
      && source /opt/ros/jazzy/setup.bash
      && colcon build --symlink-install --packages-select igvc_test_bringup --paths /root/ros2_ws/src/IGVC_robot_2026/src/*
      && source /root/ros2_ws/install/setup.bash
      && ros2 launch zed_wrapper zed_camera.launch.py camera_model:=zed2i"

  igvc_humble_fused_drive:
    build:
      context: .
      dockerfile: docker/Dockerfile.humble-fused-drive
    image: igvc-humble-fused-drive:latest
    container_name: igvc_humble_fused_drive
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    runtime: nvidia
    gpus: all
    working_dir: /root/ros2_ws
    volumes:
      - .:/root/ros2_ws/src/IGVC_robot_2026
      - igvc_humble_build:/root/ros2_ws/build
      - igvc_humble_install:/root/ros2_ws/install
      - igvc_humble_log:/root/ros2_ws/log
      - /tmp:/tmp
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - FASTDDS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
      - FASTRTPS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
      - ROS_DISTRO=humble
      - YOLOPV2_WEIGHTS=/root/ros2_ws/src/IGVC_robot_2026/models/yolopv2.pt
      - IGVC_WORKSPACE_ROOT=/root/ros2_ws/src/IGVC_robot_2026
      - DEVENV_HOST_PATH=${DEVENV_HOST_PATH:-}
    command:
      - /bin/bash
      - -lc
      - |
        set -e
        source /opt/ros/humble/setup.bash
        colcon build --symlink-install \
          --base-paths /root/ros2_ws/src/IGVC_robot_2026/src \
          --packages-select \
            simulation_interfaces \
            zed_description \
            igvc_test_description \
            grr_hardware \
            igvc_lane_detection \
            igvc_test_bringup \
            igvc_simulation_interface
        source /root/ros2_ws/install/setup.bash
        # ros2 launch igvc_test_bringup igvc_fused_drive.launch.py hardware_interface:=IsaacDriveHardware use_sim_time:=true
        /bin/bash

  # ---------------------------------------------------------------------------
  # Consolidated x86 image: ZED SDK + ZED ROS wrapper + ROS 2 Humble + Nav2 +
  # ros2_control + PyTorch, built from docker/Dockerfile.igvc-zed-humble.
  #
  # This is the open replacement for igvc_dev_zed above, which depends on the
  # private ghcr.io/gold-rush-robotics/dev-zed image (Jazzy, no public recipe).
  # Building it here keeps the x86 side on Humble, matching the Jetson images.
  #
  # TWO VARIANTS, both verified. They differ only in which ZED wrapper they
  # build and which SDK is paired with it. The pairing is not free choice -
  # the wrapper rejects an SDK outside its supported range AT RUNTIME, so the
  # rows below must be kept together. See docs/DOCKER_CHANGES.md 4.5.
  #
  #   igvc_zed_humble           org fork wrapper v5.2.1 + SDK 5.2.3
  #   igvc_zed_humble_upstream  upstream wrapper v5.4.1 + SDK 5.3.0
  #                             (same wrapper and SDK as jetson-zed)
  #
  # Which to adopt is a team decision that is still open. Both are provided so
  # nobody has to edit a Dockerfile to try the other one.
  # ---------------------------------------------------------------------------
  igvc_zed_humble:
    build:
      context: .
      dockerfile: docker/Dockerfile.igvc-zed-humble
      args:
        # Variant A - the Dockerfile defaults, restated here so the pairing is
        # visible without opening the Dockerfile.
        ZED_WRAPPER_REPO: https://github.com/Gold-Rush-Robotics/zed-ros2-wrapper-2025.git
        ZED_WRAPPER_BRANCH: master
        ZED_SDK_MAJOR: "5"
        ZED_SDK_MINOR: "2"
        ZED_SDK_PATCH: "3"
    image: igvc-zed-humble:latest
    container_name: igvc_zed_humble
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    runtime: nvidia
    gpus: all
    # ZED SDK simulation input uses IPC when the streaming source is on the
    # same machine (sim_address 127.0.0.1 in common_stereo_sim.yaml), which
    # needs the container to share the host IPC namespace. The 2026 team hit
    # this and added the same two lines to igvc_dev_zed on the competition
    # branch test_comp_changes_isaac_smi; docker-compose.jetson.yml already
    # carries them. Linux only: on Docker Desktop the "host" is the WSL2 VM,
    # not Windows, so this cannot reach an Isaac Sim running on Windows.
    ipc: host
    pid: host
    working_dir: /root/ros2_ws
    volumes:
      - .:/root/ros2_ws/src/IGVC_robot_2026
      - igvc_zed_build:/root/ros2_ws/build
      - igvc_zed_install:/root/ros2_ws/install
      - igvc_zed_log:/root/ros2_ws/log
      - /tmp:/tmp
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - FASTDDS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
      - FASTRTPS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
      - ROS_DISTRO=humble
      - YOLOPV2_WEIGHTS=/root/ros2_ws/src/IGVC_robot_2026/models/yolopv2.pt
      - IGVC_WORKSPACE_ROOT=/root/ros2_ws/src/IGVC_robot_2026
      - DEVENV_HOST_PATH=${DEVENV_HOST_PATH:-}
    command: ["bash"]

  # ---------------------------------------------------------------------------
  # Variant B. Identical to igvc_zed_humble except for the wrapper/SDK pairing.
  #
  # Uses UPSTREAM stereolabs/zed-ros2-wrapper pinned at v5.4.1, with SDK 5.3.0
  # - the same wrapper source and SDK as docker_images/jetson-zed, so the x86
  # and Jetson sides run the same code. Upstream derives its maximum supported
  # SDK from its own version (5.4), so 5.3.0 is inside the range.
  #
  # jetson-zed clones upstream with no tag, which makes its builds
  # irreproducible over time. This pins the tag deliberately.
  #
  #   docker compose build igvc_zed_humble_upstream
  # ---------------------------------------------------------------------------
  igvc_zed_humble_upstream:
    build:
      context: .
      dockerfile: docker/Dockerfile.igvc-zed-humble
      args:
        ZED_WRAPPER_REPO: https://github.com/stereolabs/zed-ros2-wrapper.git
        ZED_WRAPPER_BRANCH: v5.4.1
        ZED_SDK_MAJOR: "5"
        ZED_SDK_MINOR: "3"
        ZED_SDK_PATCH: "0"
    image: igvc-zed-humble:upstream
    container_name: igvc_zed_humble_upstream
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    runtime: nvidia
    gpus: all
    # ZED SDK simulation input uses IPC when the streaming source is on the
    # same machine (sim_address 127.0.0.1 in common_stereo_sim.yaml), which
    # needs the container to share the host IPC namespace. The 2026 team hit
    # this and added the same two lines to igvc_dev_zed on the competition
    # branch test_comp_changes_isaac_smi; docker-compose.jetson.yml already
    # carries them. Linux only: on Docker Desktop the "host" is the WSL2 VM,
    # not Windows, so this cannot reach an Isaac Sim running on Windows.
    ipc: host
    pid: host
    working_dir: /root/ros2_ws
    volumes:
      - .:/root/ros2_ws/src/IGVC_robot_2026
      # Separate volumes from variant A on purpose. The two images contain
      # different ZED builds; sharing colcon output would mix them.
      - igvc_zed_up_build:/root/ros2_ws/build
      - igvc_zed_up_install:/root/ros2_ws/install
      - igvc_zed_up_log:/root/ros2_ws/log
      - /tmp:/tmp
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - FASTDDS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
      - FASTRTPS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/IGVC_robot_2026/src/igvc_test_bringup/config/fastdds_udp.xml
      - ROS_DISTRO=humble
      - YOLOPV2_WEIGHTS=/root/ros2_ws/src/IGVC_robot_2026/models/yolopv2.pt
      - IGVC_WORKSPACE_ROOT=/root/ros2_ws/src/IGVC_robot_2026
      - DEVENV_HOST_PATH=${DEVENV_HOST_PATH:-}
    command: ["bash"]

  # ---------------------------------------------------------------------
  # Gazebo Harmonic (gz-sim 8) + ROS 2 Jazzy, NATIVE LINUX.
  #
  # The Windows equivalent is igvc_gazebo in docker-compose.windows.yml, and
  # until 2026-09-15 it was the ONLY one - so anyone on native Linux following
  # the documentation found no service to run. That is fixed here.
  #
  # The two files differ only in how the GPU and the display are reached:
  #
  #   Windows / Docker Desktop        native Linux
  #   ------------------------        ------------
  #   gpus: all                       runtime: nvidia
  #   /dev/dxg + /usr/lib/wsl         /dev/dri, the real DRM devices
  #   GALLIUM_DRIVER=d3d12            no override; use the real GL driver
  #   MESA_D3D12_DEFAULT_ADAPTER      not applicable
  #   /mnt/wslg, WSLg sockets         /tmp/.X11-unix and $DISPLAY
  #
  # On native Linux none of the WSL machinery applies: there is a real GPU and
  # a real X or Wayland server, so OpenGL works the ordinary way and the
  # silent-llvmpipe trap that dominates the Windows path does not arise in the
  # same form. Run render_check.sh anyway - a machine with no NVIDIA driver, or
  # with the wrong one, still falls back to software silently.
  #
  #   xhost +local:docker            # once per login, so the container can draw
  #   docker compose up -d igvc_gazebo_linux
  #   docker exec -it igvc_gazebo_linux bash scripts/gazebo/start_sim.sh
  #
  # NOT VERIFIED ON NATIVE LINUX. Nobody on the 2027 team runs Linux on the
  # desktop, so this service is written from the Windows one and the standard
  # ROS-in-Docker GUI recipe rather than from a machine it has been tested on.
  # If it works, delete this paragraph. If it does not, the likely culprits are
  # `runtime: nvidia` needing nvidia-container-toolkit installed, and xhost.
  #
  # AMD or Intel GPUs: drop `runtime: nvidia` and the NVIDIA_* environment
  # variables, keep /dev/dri, and Mesa will use the open driver directly.
  # ---------------------------------------------------------------------
  igvc_gazebo_linux:
    build:
      context: .
      dockerfile: docker/Dockerfile.gazebo-jazzy
    image: igvc-gazebo-jazzy:latest
    container_name: igvc_gazebo_linux
    stdin_open: true
    tty: true
    runtime: nvidia
    working_dir: /root/ros2_ws
    shm_size: "2gb"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - .:/root/ros2_ws/src/IGVC_robot_2026
      - /tmp/.X11-unix:/tmp/.X11-unix
      - igvc_gazebo_linux_build:/root/ros2_ws/build
      - igvc_gazebo_linux_install:/root/ros2_ws/install
      - igvc_gazebo_linux_log:/root/ros2_ws/log
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - GZ_VERSION=harmonic
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - ROS_DISTRO=jazzy
      - IGVC_WORKSPACE_ROOT=/root/ros2_ws/src/IGVC_robot_2026
      # So the recovery hints the scripts print name THIS file and service,
      # not the Windows ones. Read by scripts/gazebo/igvc_env.sh.
      - IGVC_COMPOSE_FILE=docker-compose.yml
      - IGVC_SERVICE=igvc_gazebo_linux
      - IGVC_CONTAINER=igvc_gazebo_linux
    command: ["bash"]

volumes:
  igvc_gazebo_linux_build:
  igvc_gazebo_linux_install:
  igvc_gazebo_linux_log:

  igvc_humble_build:
  igvc_humble_install:
  igvc_humble_log:

  # ros2 launch igvc_test_bringup isaac_nav_test.launch.py use_sim_time:=true
  igvc_zed_build:
  igvc_zed_install:
  igvc_zed_log:

  igvc_zed_up_build:
  igvc_zed_up_install:
  igvc_zed_up_log:
