# docker-compose.windows.yml
# Windows / Docker Desktop (WSL2 backend) versions of this repo's services.
#
# The main docker-compose.yml targets native Linux and cannot run as-is on
# Windows. This file drops the host-Linux-only pieces:
#
#   - /dev:/dev, /tmp:/tmp                  -> not valid Windows host paths
#   - network_mode: host                    -> maps to the WSL2 VM, not Windows
#   - runtime: nvidia                       -> Docker Desktop uses `gpus:` instead
#   - privileged                            -> only needed for real hardware access
#
# Use it explicitly, with a service name, from a WSL2 shell for anything with
# a window, or from PowerShell for anything headless:
#   docker compose -f docker-compose.windows.yml up -d igvc_gazebo
#   docker exec -it igvc_gazebo bash
# `up -d` plus `docker exec`, never `run`: `run` makes a new container, and so
# a second simulator, every time.
#
# Services:
#   igvc_gazebo                the simulator (ROS 2 Jazzy, Gazebo Harmonic)
#   igvc_dev_jazzy             the simulator image plus torch and the whole
#                              workspace's dependencies (perception, YOLOPv2)
#   igvc_zed_humble, _upstream ROBOT SIDE, still ROS 2 Humble: the ZED SDK
#                              images. Not part of the simulator path.
#
# igvc_humble_fused_drive, the ROS 2 Humble torch image, was retired on
# 2026-09-29; igvc_dev_jazzy replaced it. docker/deprecated/README.md.
#
# Talking to real hardware (ODrive over CAN, LiDAR, GPS, ZED) needs /dev
# passthrough and therefore native Linux or the Jetson.

services:
  # ROBOT SIDE, STILL ROS 2 HUMBLE. Not part of the simulator path. Porting
  # it (ZED SDK 5.5 with wrapper v5.5.0 on Jazzy, proven by launching the node)
  # is planned in docs/JAZZY_MIGRATION.md section 5.
  #
  # Consolidated image: ZED SDK + ZED ROS wrapper + Humble + Nav2 + torch.
  # Replaces the private ghcr.io/gold-rush-robotics/dev-zed on x86.
  # A ZED camera cannot be reached from Docker Desktop (no /dev passthrough),
  # so on Windows this is for building and inspecting, not live camera work.
  #
  # TWO VARIANTS, differing only in the wrapper/SDK pairing. The wrapper
  # rejects an out-of-range SDK at runtime, so these rows stay together:
  #   igvc_zed_humble           org fork wrapper v5.2.1 + SDK 5.2.3
  #   igvc_zed_humble_upstream  upstream wrapper v5.4.1 + SDK 5.3.0
  # See docs/DOCKER_CHANGES.md 4.5.
  igvc_zed_humble:
    build:
      context: .
      dockerfile: docker/Dockerfile.igvc-zed-humble
      args:
        ZED_WRAPPER_REPO: https://github.com/Gold-Rush-Robotics/zed-ros2-wrapper-2025.git
        ZED_WRAPPER_BRANCH: master
        ZED_SDK_MAJOR: "5"
        ZED_SDK_MINOR: "2"
        ZED_SDK_PATCH: "3"
    image: igvc-zed-humble:latest
    container_name: igvc_zed_humble
    stdin_open: true
    tty: true
    gpus: all
    working_dir: /root/ros2_ws
    shm_size: "2gb"
    volumes:
      - .:/root/ros2_ws/src/IGVC_robot_2026
      - igvc_zed_build:/root/ros2_ws/build
      - igvc_zed_install:/root/ros2_ws/install
      - igvc_zed_log:/root/ros2_ws/log
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - ROS_DISTRO=humble
      - YOLOPV2_WEIGHTS=/root/ros2_ws/src/IGVC_robot_2026/models/yolopv2.pt
      - IGVC_WORKSPACE_ROOT=/root/ros2_ws/src/IGVC_robot_2026
      - DEVENV_HOST_PATH=${DEVENV_HOST_PATH:-}
    command: ["bash"]

  # Variant B: upstream wrapper v5.4.1 + SDK 5.3.0 - the same wrapper source
  # and SDK as docker_images/jetson-zed, but with the tag pinned.
  #   docker compose -f docker-compose.windows.yml build igvc_zed_humble_upstream
  igvc_zed_humble_upstream:
    build:
      context: .
      dockerfile: docker/Dockerfile.igvc-zed-humble
      args:
        ZED_WRAPPER_REPO: https://github.com/stereolabs/zed-ros2-wrapper.git
        ZED_WRAPPER_BRANCH: v5.4.1
        ZED_SDK_MAJOR: "5"
        ZED_SDK_MINOR: "3"
        ZED_SDK_PATCH: "0"
    image: igvc-zed-humble:upstream
    container_name: igvc_zed_humble_upstream
    stdin_open: true
    tty: true
    gpus: all
    working_dir: /root/ros2_ws
    shm_size: "2gb"
    volumes:
      - .:/root/ros2_ws/src/IGVC_robot_2026
      # Separate from variant A: different ZED builds must not share colcon output.
      - igvc_zed_up_build:/root/ros2_ws/build
      - igvc_zed_up_install:/root/ros2_ws/install
      - igvc_zed_up_log:/root/ros2_ws/log
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - ROS_DISTRO=humble
      - YOLOPV2_WEIGHTS=/root/ros2_ws/src/IGVC_robot_2026/models/yolopv2.pt
      - IGVC_WORKSPACE_ROOT=/root/ros2_ws/src/IGVC_robot_2026
      - DEVENV_HOST_PATH=${DEVENV_HOST_PATH:-}
    command: ["bash"]

  # ---------------------------------------------------------------------
  # Gazebo Harmonic (gz-sim 8) + ROS 2 Jazzy. THE supported simulator service.
  #
  # Jazzy, not Humble: Humble reaches end of life May 2027 and the competition
  # is June 2027. Harmonic is unchanged and is now REP 2000's Tier 1 pairing
  # for Jazzy rather than an off-label choice. The Humble version of this
  # service was deleted on 2026-09-29; git history has it.
  #
  # RUN THIS FROM WSL2, NOT POWERSHELL. From a WSL2 Ubuntu shell:
  #
  #   cd "/mnt/c/IGVC 2027/IGVC_robot_2027"
  #   docker compose -f docker-compose.windows.yml build igvc_gazebo
  #   docker compose -f docker-compose.windows.yml run --rm igvc_gazebo
  #
  # Why WSL2 and not PowerShell: Docker Desktop's own Linux VM has NO display -
  # /tmp/.X11-unix is empty and there is no WSLg in it - so a container launched
  # from PowerShell can never show a window. Launched from a WSL2 distro, the
  # distro's WSLg sockets are mounted through and the Gazebo GUI opens as a
  # normal Windows window, on the same D3D12 NVIDIA render path. Verified
  # 2026-09-15.
  #
  # This requires Docker Desktop -> Settings -> Resources -> WSL Integration
  # enabled for the distro. Headless work still functions from PowerShell.
  #
  # Verify GPU rendering before doing any camera work:
  #   bash src/IGVC_robot_2026/scripts/gazebo/render_check.sh
  #
  # THE FOUR SETTINGS BELOW ARE NOT OPTIONAL AND NOT COSMETIC.
  # Measured on the RTX 5070 Ti Laptop, 2026-09-10:
  #   without them   GL_RENDERER = llvmpipe (LLVM 15.0.7, 256 bits)  <- CPU
  #   with them      GL_RENDERER = D3D12 (NVIDIA GeForce RTX 5070 Ti Laptop GPU)
  #
  # Why each one:
  #  1. device /dev/dxg          the WSL2 GPU device. Present already, but the
  #                              container needs it declared.
  #  2. /usr/lib/wsl mount       holds libd3d12core.so and libdxcore.so. Mesa's
  #                              d3d12_dri.so is in the image but cannot load
  #                              without these, and Mesa then falls back to
  #                              llvmpipe SILENTLY. This is the whole trick.
  #  3. GALLIUM_DRIVER=d3d12     select the WSL GPU path rather than software.
  #  4. MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA
  #                              this is a dual-GPU laptop (Intel Arc iGPU on
  #                              the Core Ultra 9 275HX plus the RTX 5070 Ti).
  #                              Without this Mesa picks the INTEL adapter and
  #                              gz sim aborts inside Intel's WSL driver with an
  #                              LLVM fatal error in libigc.so. The crash looks
  #                              like a Gazebo bug and is not one.
  #
  # NVIDIA_DRIVER_CAPABILITIES=all is set in the Dockerfile for the same class
  # of reason: the container runtime default is utility,compute, which does not
  # include graphics.
  igvc_gazebo:
    build:
      context: .
      dockerfile: docker/Dockerfile.gazebo-jazzy
    image: igvc-gazebo-jazzy:latest
    container_name: igvc_gazebo
    stdin_open: true
    tty: true
    gpus: all
    devices:
      - /dev/dxg
    working_dir: /root/ros2_ws
    shm_size: "2gb"
    volumes:
      - .:/root/ros2_ws/src/IGVC_robot_2026
      # The WSL GPU driver libraries. Read-only: nothing should write here.
      - /usr/lib/wsl:/usr/lib/wsl:ro
      # WSLg display. These are what make the Gazebo GUI appear as a normal
      # Windows window. They only resolve when `docker compose` is run from
      # INSIDE the WSL2 distro - see the RUN THIS FROM WSL2 note above.
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
      - igvc_gazebo_build:/root/ros2_ws/build
      - igvc_gazebo_install:/root/ros2_ws/install
      - igvc_gazebo_log:/root/ros2_ws/log
    environment:
      - GALLIUM_DRIVER=d3d12
      - MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib:/opt/ros/jazzy/lib
      # Inherited from the WSL2 shell. Unset if run from PowerShell, in which
      # case the GUI is unavailable and headless still works.
      - DISPLAY=${DISPLAY:-}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - PULSE_SERVER=/mnt/wslg/PulseServer
      - GZ_VERSION=harmonic
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - ROS_DISTRO=jazzy
      - IGVC_WORKSPACE_ROOT=/root/ros2_ws/src/IGVC_robot_2026
    command: ["bash"]

  # ---------------------------------------------------------------------
  # The dev image: the Gazebo image above PLUS torch (CUDA 13.0, sm_120),
  # ultralytics, and every apt package the whole 22-package workspace needs.
  # ROS 2 Jazzy, same ROS build as igvc_gazebo. Optional: only for people
  # running perception (YOLOPv2, yolo_ros) or building the whole workspace.
  # NVIDIA GPUs only for torch; the simulator in it works on any tier.
  #
  # It replaced the Humble igvc_humble_fused_drive service on 2026-09-29;
  # that Dockerfile is in docker/deprecated/ for one season. See docker/Dockerfile.dev-jazzy and
  # docs/MAINTAINING_ENVIRONMENTS.md.
  #
  # Two ways to use it, from a WSL2 shell in the repo root:
  #
  #   1. AS the simulator container. It carries everything igvc_gazebo does,
  #      with the same GPU and display settings below, so every script in
  #      scripts/gazebo/ runs in it unchanged:
  #        docker compose -f docker-compose.windows.yml up -d igvc_dev_jazzy
  #        docker exec -it igvc_dev_jazzy bash src/IGVC_robot_2026/scripts/gazebo/start_sim.sh
  #
  #   2. BESIDE igvc_gazebo, on the same ROS_DOMAIN_ID, running only
  #      perception nodes against the simulator's topics. Both containers sit
  #      on this compose file's network, as the Humble container used to.
  #
  # NEVER run a simulator in both at once on one ROS_DOMAIN_ID: two /clock,
  # /odom and /tf publishers, results that look real and are worthless.
  # sim_preflight.sh cannot see across containers, so this is on you.
  #
  # Separate colcon volumes from igvc_gazebo on purpose: a second container
  # building into the same install tree at the same time corrupts it.
  # ---------------------------------------------------------------------
  igvc_dev_jazzy:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev-jazzy
    image: igvc-dev-jazzy:latest
    container_name: igvc_dev_jazzy
    stdin_open: true
    tty: true
    gpus: all
    devices:
      - /dev/dxg
    working_dir: /root/ros2_ws
    shm_size: "2gb"
    volumes:
      - .:/root/ros2_ws/src/IGVC_robot_2026
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
      - igvc_dev_jazzy_build:/root/ros2_ws/build
      - igvc_dev_jazzy_install:/root/ros2_ws/install
      - igvc_dev_jazzy_log:/root/ros2_ws/log
    environment:
      - GALLIUM_DRIVER=d3d12
      - MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib:/opt/ros/jazzy/lib
      - DISPLAY=${DISPLAY:-}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - PULSE_SERVER=/mnt/wslg/PulseServer
      - GZ_VERSION=harmonic
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - ROS_DISTRO=jazzy
      - IGVC_WORKSPACE_ROOT=/root/ros2_ws/src/IGVC_robot_2026
      # Where lane_segmentation_node looks when its config names no weights.
      # Fetch them once: src/igvc_lane_detection/scripts/fetch_yolopv2_weights.sh
      - YOLOPV2_WEIGHTS=/root/ros2_ws/src/IGVC_robot_2026/models/yolopv2.pt
      # So the recovery hints the scripts print name THIS service and
      # container. Read by scripts/gazebo/igvc_env.sh.
      - IGVC_COMPOSE_FILE=docker-compose.windows.yml
      - IGVC_SERVICE=igvc_dev_jazzy
      - IGVC_CONTAINER=igvc_dev_jazzy
    command: ["bash"]

volumes:
  igvc_zed_build:
  igvc_zed_install:
  igvc_zed_log:
  igvc_zed_up_build:
  igvc_zed_up_install:
  igvc_zed_up_log:
  igvc_gazebo_build:
  igvc_gazebo_install:
  igvc_gazebo_log:
  igvc_dev_jazzy_build:
  igvc_dev_jazzy_install:
  igvc_dev_jazzy_log:
