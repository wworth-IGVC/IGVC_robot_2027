# ─────────────────────────────────────────────────────────────────────────────
#  STILL MISSING FROM THE 3.7 CONTRACT, deliberately
#
#  /fix  (sensor_msgs/NavSatFix)
#      Gazebo has a navsat sensor and it would be a short xacro block, but the
#      world needs <spherical_coordinates> before it produces anything sane,
#      and every sim config in this repo runs with gps_enabled: false - the
#      Isaac path did not publish it either. Small, queued, not urgent.
#
#  /isaac_joint_cmd  (sensor_msgs/JointState, ROS to sim)
#      The control path, not the sensor path. Gazebo's DiffDrive takes
#      /cmd_vel and has no joint-velocity input, so honouring this topic means
#      choosing between the two options in RQ-06: run gz_ros2_control (now a
#      binary on Jazzy) inside Gazebo, or write a GazeboDriveHardware that
#      mirrors IsaacDriveHardware over topics. That is a team decision with
#      real consequences for control-loop timing and it is not made here.
#      Until it is, Nav2 cannot close the loop on Gazebo - and Nav2 is not in
#      the Gazebo image yet either. See DOCKER_CHANGES.md outstanding item 19.
# ─────────────────────────────────────────────────────────────────────────────
